<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modal Explorer</title>
  <style>
    :root {
      --bg: #0f0f13;
      --bg2: #1a1a22;
      --bg3: #252530;
      --text: #e8e8f0;
      --text2: #a0a0b0;
      --accent: #6c8cff;
      --tonic: #ffd700;
      --dominant: #ff8c42;
      --subdominant: #42c8ff;
      --key-w: 72px;
      --key-h: 220px;
      --gap: 8px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 600;
      margin-bottom: 4px;
      letter-spacing: 1px;
    }

    .subtitle {
      color: var(--text2);
      font-size: 0.85rem;
      margin-bottom: 20px;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      align-items: center;
      margin-bottom: 20px;
      background: var(--bg2);
      padding: 16px 24px;
      border-radius: 16px;
      border: 1px solid #333;
      max-width: 900px;
      width: 100%;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .control-group label {
      font-size: 0.7rem;
      color: var(--text2);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    select,
    input[type="range"] {
      background: var(--bg3);
      color: var(--text);
      border: 1px solid #444;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 0.9rem;
      cursor: pointer;
      outline: none;
      min-width: 140px;
    }

    select:focus {
      border-color: var(--accent);
    }

    input[type="range"] {
      min-width: 100px;
      padding: 0;
      height: 6px;
    }

    .scale-desc {
      color: var(--text2);
      font-size: 0.8rem;
      margin-bottom: 12px;
      text-align: center;
      max-width: 700px;
      line-height: 1.5;
    }

    .keyboard-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      width: 100%;
      max-width: 1200px;
    }

    .keyboard-row {
      display: flex;
      gap: var(--gap);
      justify-content: center;
      flex-wrap: wrap;
    }

    .key {
      width: var(--key-w);
      height: var(--key-h);
      background: linear-gradient(180deg, var(--bg3) 0%, var(--bg2) 100%);
      border: 2px solid #3a3a4a;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      padding-bottom: 16px;
      cursor: pointer;
      transition: all 0.08s ease;
      position: relative;
      user-select: none;
    }

    .key:hover {
      border-color: var(--accent);
      transform: translateY(-4px);
      box-shadow: 0 8px 24px rgba(108, 140, 255, 0.15);
    }

    .key.active {
      border-color: var(--accent);
      background: linear-gradient(180deg, #2a2a40 0%, #1e1e30 100%);
      transform: translateY(2px);
      box-shadow: 0 0 20px rgba(108, 140, 255, 0.3);
    }

    .key.tonic {
      border-color: var(--tonic);
      background: linear-gradient(180deg, #3a3518 0%, #2a2510 100%);
    }

    .key.tonic:hover {
      box-shadow: 0 8px 24px rgba(255, 215, 0, 0.2);
    }

    .key.tonic.active {
      box-shadow: 0 0 20px rgba(255, 215, 0, 0.4);
    }

    .key.dominant {
      border-color: var(--dominant);
    }

    .key.subdominant {
      border-color: var(--subdominant);
    }

    .key .note-name {
      font-size: 1.4rem;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .key .degree {
      font-size: 0.75rem;
      color: var(--text2);
      margin-bottom: 8px;
    }

    .key .bind {
      font-size: 0.7rem;
      color: #666;
      background: rgba(0, 0, 0, 0.3);
      padding: 2px 8px;
      border-radius: 4px;
      font-family: monospace;
    }

    .key.tonic .note-name {
      color: var(--tonic);
    }

    .key.dominant .note-name {
      color: var(--dominant);
    }

    .key.subdominant .note-name {
      color: var(--subdominant);
    }

    .legend {
      display: flex;
      gap: 20px;
      justify-content: center;
      margin-top: 8px;
      flex-wrap: wrap;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      color: var(--text2);
    }

    .legend-dot {
      width: 12px;
      height: 12px;
      border-radius: 3px;
      border: 2px solid;
    }

    .hint {
      color: var(--text2);
      font-size: 0.75rem;
      margin-top: 8px;
      text-align: center;
    }

    .octave-label {
      font-size: 0.65rem;
      color: #555;
      position: absolute;
      top: 8px;
      right: 8px;
    }

    .lang-switch {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    .lang-switch button {
      background: var(--bg3);
      color: var(--text2);
      border: 1px solid #444;
      border-radius: 6px;
      padding: 4px 12px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .lang-switch button:hover {
      border-color: var(--accent);
      color: var(--text);
    }

    .lang-switch button.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    @media (max-width: 768px) {
      :root {
        --key-w: 52px;
        --key-h: 160px;
        --gap: 4px;
      }

      .controls {
        padding: 12px;
      }

      h1 {
        font-size: 1.2rem;
      }
    }
  </style>
</head>

<body>
  <h1 id="title">🎹 Modal Explorer</h1>
  <p class="subtitle" id="subtitle">Find melodic inspiration across different modes</p>

  <div class="lang-switch" id="langSwitch"></div>

  <div class="controls">
    <div class="control-group">
      <label id="lblCategory">Category</label>
      <select id="categorySelect"></select>
    </div>
    <div class="control-group">
      <label id="lblScale">Scale</label>
      <select id="scaleSelect"></select>
    </div>
    <div class="control-group">
      <label id="lblTonic">Tonic</label>
      <select id="tonicSelect"></select>
    </div>
    <div class="control-group">
      <label id="lblOctave">Octave</label>
      <select id="octaveSelect">
        <option value="3">C3</option>
        <option value="4" selected>C4</option>
        <option value="5">C5</option>
      </select>
    </div>
    <div class="control-group">
      <label id="lblExtend">Extend</label>
      <select id="extendSelect">
        <option value="0" id="optExt0">None</option>
        <option value="1" selected id="optExt1">±1</option>
        <option value="2" id="optExt2">±2</option>
        <option value="3" id="optExt3">±3</option>
        <option value="4" id="optExt4">±4</option>
      </select>
    </div>
    <div class="control-group">
      <label id="lblWaveform">Waveform</label>
      <select id="waveformSelect">
        <option value="triangle" selected id="optTri">Triangle</option>
        <option value="sine" id="optSine">Sine</option>
        <option value="square" id="optSquare">Square</option>
        <option value="sawtooth" id="optSaw">Sawtooth</option>
      </select>
    </div>
    <div class="control-group">
      <label id="lblVolume">Volume</label>
      <input type="range" id="volumeSlider" min="0" max="100" value="60">
    </div>
  </div>

  <div class="scale-desc" id="scaleDesc"></div>

  <div class="keyboard-wrap">
    <div class="keyboard-row" id="keyboard"></div>
    <div class="legend">
      <div class="legend-item">
        <div class="legend-dot" style="border-color:var(--tonic);background:rgba(255,215,0,0.1)"></div>
        <span id="legTonic">Tonic</span>
      </div>
      <div class="legend-item">
        <div class="legend-dot" style="border-color:var(--dominant);background:rgba(255,140,66,0.1)"></div>
        <span id="legDominant">Dominant</span>
      </div>
      <div class="legend-item">
        <div class="legend-dot" style="border-color:var(--subdominant);background:rgba(66,200,255,0.1)"></div>
        <span id="legSubdominant">Subdominant</span>
      </div>
      <div class="legend-item">
        <div class="legend-dot" style="border-color:var(--accent);background:rgba(108,140,255,0.1)"></div>
        <span id="legOther">Other</span>
      </div>
    </div>
    <p class="hint" id="hint">💡 Use number keys 1-0 and Q-P to play</p>
  </div>

    let currentLang = 'en';

    function detectLang() {
      const nav = navigator.language || navigator.userLanguage || 'en';
      if (nav.startsWith('zh')) return 'zh';
      if (nav.startsWith('ja')) return 'ja';
      return 'en';
    }

    function setLang(lang) {
      currentLang = lang;
      const t = I18N[lang];
      document.getElementById('title').textContent = t.title;
      document.getElementById('subtitle').textContent = t.subtitle;
      document.getElementById('lblCategory').textContent = t.category;
      document.getElementById('lblScale').textContent = t.scale;
      document.getElementById('lblTonic').textContent = t.tonic;
      document.getElementById('lblOctave').textContent = t.octave;
      document.getElementById('lblExtend').textContent = t.extend;
      document.getElementById('lblWaveform').textContent = t.waveform;
      document.getElementById('lblVolume').textContent = t.volume;
      document.getElementById('legTonic').textContent = t.legTonic;
      document.getElementById('legDominant').textContent = t.legDominant;
      document.getElementById('legSubdominant').textContent = t.legSubdominant;
      document.getElementById('legOther').textContent = t.legOther;
      document.getElementById('hint').textContent = t.hint;
      document.getElementById('optExt0').textContent = t.ext0;
      document.getElementById('optExt1').textContent = t.ext1;
      document.getElementById('optExt2').textContent = t.ext2;
      document.getElementById('optExt3').textContent = t.ext3;
      document.getElementById('optExt4').textContent = t.ext4;
      document.getElementById('optTri').textContent = t.tri;
      document.getElementById('optSine').textContent = t.sine;
      document.getElementById('optSquare').textContent = t.square;
      document.getElementById('optSaw').textContent = t.saw;
      document.querySelector('#octaveSelect option[value="3"]').textContent = t.octLow;
      document.querySelector('#octaveSelect option[value="4"]').textContent = t.octMid;
      document.querySelector('#octaveSelect option[value="5"]').textContent = t.octHigh;
      document.querySelectorAll('.lang-switch button').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.lang === lang);
      });
      renderControls();
      renderKeyboard();
    }

    function initLangSwitch() {
      const container = document.getElementById('langSwitch');
      const langs = [
        { code: 'zh', label: '中文' },
        { code: 'en', label: 'English' },
        { code: 'ja', label: '日本語' }
      ];
      langs.forEach(l => {
        const btn = document.createElement('button');
        btn.dataset.lang = l.code;
        btn.textContent = l.label;
        btn.addEventListener('click', () => setLang(l.code));
        container.appendChild(btn);
      });
    }

            desc: { zh: "音程：小三─大二─大二─小三─大二 | 暗淡柔和，小调色彩", en: "m3-M2-M2-m3-M2 | Dim and soft, minor color", ja: "短3─長2─長2─短3─長2 | 暗く柔らかい、短調の色彩" }
          }
        ]
      },
      {
        id: "japanese",
        name: { zh: "日本民族调式", en: "Japanese Modes", ja: "日本の民族調式" },
        scales: [
          {
            id: "miyako", intervals: [0, 1, 5, 7, 8], degrees: ["主", "↓II", "IV", "V", "↓VI"],
            name: { zh: "都节调式 · 日本", en: "Miyako-bushi", ja: "都節調式" },
            desc: { zh: "音程：半─大三─全─半─大三 | 日本传统音乐，凄美哀伤", en: "H-M3-W-H-M3 | Japanese traditional, bittersweet sorrow", ja: "半─長3─全─半─長3 | 日本の伝統音楽、物哀れな悲しみ" }
          },
          {
            id: "ryukyu", intervals: [0, 4, 5, 7, 11], degrees: ["主", "III", "IV", "V", "VII"],
            name: { zh: "琉球调式 · 日本", en: "Ryukyu", ja: "琉球調式" },
            desc: { zh: "音程：大三─半─全─大三─半 | 冲绳民谣，独特的大三度跳跃", en: "M3-H-W-M3-H | Okinawan folk, unique major 3rd leap", ja: "長3─半─全─長3─半 | 沖縄民謡、独特な長3度の跳躍" }
          }
        ]
      },
      {
        id: "other",
        name: { zh: "其他特色调式", en: "Other Scales", ja: "その他の特色ある音階" },
        scales: [
          {
            id: "blues", intervals: [0, 3, 5, 6, 7, 10], degrees: ["I", "♭III", "IV", "♯IV", "V", "♭VII"],
            name: { zh: "Blues · 蓝调音阶", en: "Blues Scale", ja: "ブルース・スケール" },
            desc: { zh: "音程：小三─全─半─半─小三─全 | 蓝调音符带来独特张力", en: "m3-W-H-H-m3-W | Blues note creates unique tension", ja: "短3─全─半─半─短3─全 | ブルースノートが独特の緊張感を生む" }
          },
          {
            id: "wholeTone", intervals: [0, 2, 4, 6, 8, 10], degrees: ["I", "II", "III", "♯IV", "♯V", "♯VI"],
            name: { zh: "Whole Tone · 全音音阶", en: "Whole Tone", ja: "全音音階" },
            desc: { zh: "音程：全─全─全─全─全─全 | 德彪西最爱，模糊无根感", en: "All whole steps | Debussy's favorite, rootless ambiguity", ja: "全─全─全─全─全─全 | ドビュッシーの愛好、根無しの曖昧さ" }
          },
          {
            id: "halfWholeDim", intervals: [0, 1, 3, 4, 6, 7, 9, 10], degrees: ["I", "♭II", "♭III", "III", "♯IV", "V", "VI", "♭VII"],
            name: { zh: "Half-Whole · 半全减音阶", en: "Half-Whole Diminished", ja: "ハーフ・ホール・ディミニッシュ" },
            desc: { zh: "音程：半─全─半─全─半─全─半─全 | 爵士乐常用，减七和弦色彩", en: "H-W-H-W-H-W-H-W | Jazz favorite, diminished 7th color", ja: "半─全─半─全─半─全─半─全 | ジャズで多用、減7和音の色彩" }
          },
          {
            id: "wholeHalfDim", intervals: [0, 2, 3, 5, 6, 8, 9, 11], degrees: ["I", "II", "♭III", "IV", "♭V", "♭VI", "♭VII", "VII"],
            name: { zh: "Whole-Half · 全半减音阶", en: "Whole-Half Diminished", ja: "ホール・ハーフ・ディミニッシュ" },
            desc: { zh: "音程：全─半─全─半─全─半─全─半 | 另一种减音阶排列", en: "W-H-W-H-W-H-W-H | Alternative diminished arrangement", ja: "全─半─全─半─全─半─全─半 | 別のディミニッシュ配列" }
          },
          {
            id: "harmonicMinor", intervals: [0, 2, 3, 5, 7, 8, 11], degrees: ["I", "II", "♭III", "IV", "V", "♭VI", "VII"],
            name: { zh: "Harmonic Minor · 和声小调", en: "Harmonic Minor", ja: "和声短音階" },
            desc: { zh: "音程：全─半─全─全─半─增二─半 | 升高七级，异域风情", en: "W-H-W-W-H-A2-H | Raised 7th, exotic flavor", ja: "全─半─全─全─半─増2─半 | 7度を高めた異国情緒" }
          },
          {
            id: "melodicMinor", intervals: [0, 2, 3, 5, 7, 9, 11], degrees: ["I", "II", "♭III", "IV", "V", "VI", "VII"],
            name: { zh: "Melodic Minor · 旋律小调 (上行)", en: "Melodic Minor (Asc)", ja: "旋律短音階 (上行)" },
            desc: { zh: "音程：全─半─全─全─全─全─半 | 升高六七级，爵士乐常用", en: "W-H-W-W-W-W-H | Raised 6th/7th, jazz favorite", ja: "全─半─全─全─全─全─半 | 6度・7度を高めたジャズで多用" }
          },
          {
            id: "phrygianDom", intervals: [0, 1, 4, 5, 7, 8, 10], degrees: ["I", "♭II", "III", "IV", "V", "♭VI", "♭VII"],
            name: { zh: "Phrygian Dominant · 大佛里吉亚", en: "Phrygian Dominant", ja: "フリジアン・ドミナント" },
            desc: { zh: "音程：半─小三─半─全─半─全─全 | 弗拉门戈、中东音乐", en: "H-m3-H-W-H-W-W | Flamenco, Middle Eastern music", ja: "半─短3─半─全─半─全─全 | フラメンコ、中東音楽" }
          },
          {
            id: "hungarianMinor", intervals: [0, 2, 3, 6, 7, 8, 11], degrees: ["I", "II", "♭III", "♯IV", "V", "♭VI", "VII"],
            name: { zh: "Hungarian Minor · 匈牙利小音阶", en: "Hungarian Minor", ja: "ハンガリー・マイナー" },
            desc: { zh: "音程：全─半─增二─半─半─增二─半 | 吉普赛、匈牙利民间音乐", en: "W-H-A2-H-H-A2-H | Gypsy, Hungarian folk music", ja: "全─半─増2─半─半─増2─半 | ジプシー、ハンガリー民謡" }
          },
          {
            id: "persian", intervals: [0, 1, 4, 5, 6, 9, 10], degrees: ["I", "♭II", "III", "IV", "♭V", "♯V", "♭VII"],
            name: { zh: "Persian · 波斯音阶", en: "Persian", ja: "ペルシアン・スケール" },
            desc: { zh: "音程：半─小三─半─半─小三─半─全 | 中东、波斯音乐色彩", en: "H-m3-H-H-m3-H-W | Middle Eastern, Persian color", ja: "半─短3─半─半─短3─半─全 | 中東、ペルシア音楽の色彩" }
          }
        ]
      }
    ];

    const TONIC_NAMES = [
      { midi: 0, label: "C" },
      { midi: 1, label: "C♯ / D♭" },
      { midi: 2, label: "D" },
      { midi: 3, label: "D♯ / E♭" },
      { midi: 4, label: "E" },
      { midi: 5, label: "F" },
      { midi: 6, label: "F♯ / G♭" },
      { midi: 7, label: "G" },
      { midi: 8, label: "G♯ / A♭" },
      { midi: 9, label: "A" },
      { midi: 10, label: "A♯ / B♭" },
      { midi: 11, label: "B" }
    ];

    const KEY_BINDINGS = [
      '1', '2', '3', '4', '5', '6', '7', '8', '9', '0',
      'q', 'w', 'e', 'r', 't', 'y', 'u', 'i', 'o', 'p',
      'a', 's', 'd', 'f', 'g', 'h', 'j', 'k', 'l', ';'
    ];

    // ===================== Audio Engine =====================
    let audioCtx = null, masterGain = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        masterGain = audioCtx.createGain();
        masterGain.connect(audioCtx.destination);
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function setVolume(val) { if (masterGain) masterGain.gain.value = val / 100; }

    function playNote(midi, waveform = 'triangle', duration = 0.15) {
      initAudio();
      const freq = 440 * Math.pow(2, (midi - 69) / 12);
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = waveform;
      osc.frequency.value = freq;
      const now = audioCtx.currentTime;
      gain.gain.setValueAtTime(0, now);
      gain.gain.linearRampToValueAtTime(1, now + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.3, now + 0.09);
      gain.gain.setValueAtTime(0.3, now + duration);
      gain.gain.exponentialRampToValueAtTime(0.001, now + duration + 0.2);
      osc.connect(gain);
      gain.connect(masterGain);
      osc.start(now);
      osc.stop(now + duration + 0.3);
      setTimeout(() => { osc.disconnect(); gain.disconnect(); }, (duration + 0.35) * 1000);
    }

    // ===================== UI Logic =====================
    const $ = id => document.getElementById(id);
    const categorySelect = $('categorySelect');
    const scaleSelect = $('scaleSelect');
    const tonicSelect = $('tonicSelect');
    const octaveSelect = $('octaveSelect');
    const extendSelect = $('extendSelect');
    const waveformSelect = $('waveformSelect');
    const volumeSlider = $('volumeSlider');
    const keyboardEl = $('keyboard');
    const scaleDescEl = $('scaleDesc');

    function getText(obj) { return obj[currentLang] || obj.en || obj.zh || ''; }

    function renderControls() {
      const catVal = categorySelect.value;
      categorySelect.innerHTML = '';
      SCALE_CATEGORIES.forEach(cat => {
        const opt = document.createElement('option');
        opt.value = cat.id;
        opt.textContent = getText(cat.name);
        categorySelect.appendChild(opt);
      });
      if (Array.from(categorySelect.options).some(o => o.value === catVal)) categorySelect.value = catVal;
      updateScaleOptions();
    }

    function updateScaleOptions() {
      const cat = SCALE_CATEGORIES.find(c => c.id === categorySelect.value);
      const scaleVal = scaleSelect.value;
      scaleSelect.innerHTML = '';
      cat.scales.forEach(s => {
        const opt = document.createElement('option');
        opt.value = s.id;
        opt.textContent = getText(s.name);
        scaleSelect.appendChild(opt);
      });
      if (cat.scales.some(s => s.id === scaleVal)) scaleSelect.value = scaleVal;
      renderKeyboard();
    }

    function getCurrentScale() {
      const cat = SCALE_CATEGORIES.find(c => c.id === categorySelect.value);
      return cat.scales.find(s => s.id === scaleSelect.value);
    }

    function buildNotes() {
      const scale = getCurrentScale();
      const tonicMidi = parseInt(tonicSelect.value);
      const baseOctave = parseInt(octaveSelect.value);
      const extend = parseInt(extendSelect.value);
      const baseTonic = tonicMidi + baseOctave * 12;
      const intervals = scale.intervals;
      const degrees = scale.degrees;

      const octaveNotes = intervals.map((interval, idx) => ({
        midi: baseTonic + interval,
        degree: degrees[idx],
        interval,
        isTonic: interval === 0,
        isDominant: interval === 7,
        isSubdominant: interval === 5
      }));

      const topTonic = {
        midi: baseTonic + 12,
        degree: degrees[0],
        interval: 12,
        isTonic: true,
        isDominant: false,
        isSubdominant: false
      };

      let allNotes = [...octaveNotes, topTonic];

      if (extend > 0) {
        const prevStart = baseTonic - 12;
        const downNotes = intervals.slice(-extend).map((int, idx) => ({
          midi: prevStart + int,
          degree: degrees[intervals.length - extend + idx],
          interval: int - 12,
          isTonic: false,
          isDominant: int === 7,
          isSubdominant: int === 5,
          extended: true
        }));
        allNotes = [...downNotes, ...allNotes];
      }

      if (extend > 0) {
        const nextStart = baseTonic + 12;
        const upNotes = intervals.slice(1, extend + 1).map((int, idx) => ({
          midi: nextStart + int,
          degree: degrees[idx + 1],
          interval: int + 12,
          isTonic: false,
          isDominant: int === 7,
          isSubdominant: int === 5,
          extended: true
        }));
        allNotes.push(...upNotes);
      }

      return { notes: allNotes, scale };
    }

    function midiToNoteName(midi, preferSharp = true) {
      const namesSharp = ['C', 'C♯', 'D', 'D♯', 'E', 'F', 'F♯', 'G', 'G♯', 'A', 'A♯', 'B'];
      const namesFlat = ['C', 'D♭', 'D', 'E♭', 'E', 'F', 'G♭', 'G', 'A♭', 'A', 'B♭', 'B'];
      const pc = ((midi % 12) + 12) % 12;
      return preferSharp ? namesSharp[pc] : namesFlat[pc];
    }

    function renderKeyboard() {
      const { notes, scale } = buildNotes();
      keyboardEl.innerHTML = '';
      const t = I18N[currentLang];
      scaleDescEl.textContent = getText(scale.desc) + ' | ' + (t.count ? t.count + ' ' : '') + notes.length + ' ' + t.notes;

      notes.forEach((note, idx) => {
        const key = document.createElement('div');
        key.className = 'key';
        if (note.isTonic) key.classList.add('tonic');
        else if (note.isDominant) key.classList.add('dominant');
        else if (note.isSubdominant) key.classList.add('subdominant');

        const bind = KEY_BINDINGS[idx] || '';
        key.innerHTML = `
          <span class="octave-label">${Math.floor(note.midi / 12) - 1}</span>
          <div class="note-name">${midiToNoteName(note.midi)}</div>
          <div class="degree">${note.degree}</div>
          ${bind ? `<div class="bind">${bind.toUpperCase()}</div>` : ''}
        `;
        key.dataset.midi = note.midi;
        key.dataset.bind = bind;

        const start = () => { key.classList.add('active'); playNote(note.midi, waveformSelect.value, 0.3); };
        const end = () => key.classList.remove('active');

        key.addEventListener('mousedown', start);
        key.addEventListener('mouseup', end);
        key.addEventListener('mouseleave', end);
        key.addEventListener('touchstart', e => { e.preventDefault(); start(); });
        key.addEventListener('touchend', end);

        keyboardEl.appendChild(key);
      });
    }

    const pressedKeys = new Set();

    document.addEventListener('keydown', e => {
      if (e.repeat) return;
      const idx = KEY_BINDINGS.indexOf(e.key.toLowerCase());
      if (idx === -1) return;
      const keys = keyboardEl.querySelectorAll('.key');
      if (idx < keys.length && !pressedKeys.has(e.key)) {
        pressedKeys.add(e.key);
        keys[idx].classList.add('active');
        playNote(parseInt(keys[idx].dataset.midi), waveformSelect.value, 0.3);
      }
    });

    document.addEventListener('keyup', e => {
      const idx = KEY_BINDINGS.indexOf(e.key.toLowerCase());
      if (idx === -1) return;
      pressedKeys.delete(e.key);
      const keys = keyboardEl.querySelectorAll('.key');
      if (idx < keys.length) keys[idx].classList.remove('active');
    });

    // Initialize
    TONIC_NAMES.forEach(t => {
      const opt = document.createElement('option');
      opt.value = t.midi;
      opt.textContent = t.label;
      tonicSelect.appendChild(opt);
    });

    initLangSwitch();
    setLang(detectLang());

    categorySelect.addEventListener('change', updateScaleOptions);
    scaleSelect.addEventListener('change', renderKeyboard);
    tonicSelect.addEventListener('change', renderKeyboard);
    octaveSelect.addEventListener('change', renderKeyboard);
    extendSelect.addEventListener('change', renderKeyboard);
    volumeSlider.addEventListener('input', e => setVolume(e.target.value));
    setVolume(volumeSlider.value);
  </script>
</body>
